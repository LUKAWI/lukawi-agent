[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lukawi"
version = "0.1.3"
description = "A lightweight AI Agent framework with ReAct loop, tool calling, and memory"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Lukawi Team"},
]
urls = { repository = "https://github.com/lukawi-team/lukawi" }
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
    "chromadb>=0.5.0",
    "dashscope>=1.20.0",
    "numpy>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
lukawi = "lukawi.main:main"
lukawi-init = "lukawi.cli.init:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lukawi = [
    "py.typed",
    "data/*.yaml",
    "data/*.yml",
    "server/static/index.html",
    "server/static/assets/*.js",
    "server/static/assets/*.css",
]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
