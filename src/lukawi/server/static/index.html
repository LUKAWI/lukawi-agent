<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <title>Lukawi Agent</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23171717'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Inter, system-ui, sans-serif' font-weight='700' font-size='64' fill='%23ffffff'%3EL%3C/text%3E%3C/svg%3E" />
    <script type="module" crossorigin src="/assets/index-YQw0s-M7.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CgoSLmvt.css">
    <style>
      body { margin: 0; }

      .sidebar-section.sessions-section .sidebar-item {
        cursor: pointer;
        position: relative;
      }
      .sidebar-section.sessions-section .sidebar-item.active {
        background: #1a3a2e;
      }
      .sidebar-section.sessions-section .sidebar-item.active:hover {
        background: #1e4435;
      }
      .sidebar-section.sessions-section .sidebar-item.active .session-meta {
        color: #5a8a74;
      }

      .sidebar-section.sessions-section .session-info {
        flex: 1;
        min-width: 0;
      }
      .sidebar-section.sessions-section .session-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sidebar-section.sessions-section .session-meta {
        font-size: 11px;
        color: #666;
        margin-top: 2px;
      }

      .sidebar-section.sessions-section .session-delete {
        opacity: 0;
        width: 20px;
        min-width: 20px;
        height: 20px;
        border: none;
        background: transparent;
        color: #555;
        cursor: pointer;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        transition: opacity 0.12s, background 0.12s, color 0.12s;
        padding: 0;
        line-height: 1;
      }
      .sidebar-section.sessions-section .sidebar-item:hover .session-delete {
        opacity: 1;
      }
      .sidebar-section.sessions-section .session-delete:hover {
        color: #ef4444;
        background: rgba(239, 68, 68, 0.12);
      }

      .sidebar-session-add-btn {
        background: none;
        border: none;
        color: #888;
        cursor: pointer;
        font-size: 16px;
        width: 24px;
        height: 24px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        line-height: 1;
        transition: background 0.12s, color 0.12s;
      }
      .sidebar-session-add-btn:hover {
        background: #2a2a2a;
        color: #e0e0e0;
      }

      .sidebar-sessions-empty {
        padding: 12px 0;
        text-align: center;
        color: #555;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function getCurrentSessionId() {
          var params = new URLSearchParams(window.location.search);
          return params.get('session') || '';
        }

        function setSessionId(id) {
          if (!id || id === getCurrentSessionId()) return;
          var url = new URL(window.location.href);
          url.searchParams.set('session', id);
          window.history.replaceState({}, '', url.toString());
          renderSessionsIntoReact();
        }

        // Inject session_id from URL into /api/chat POST requests
        var _originalFetch = window.fetch;
        window.fetch = function(url, options) {
          if (options && options.method === 'POST' && typeof url === 'string' && url.includes('/api/chat')) {
            var sessionId = getCurrentSessionId();
            if (sessionId && !url.includes('session_id=')) {
              var separator = url.includes('?') ? '&' : '?';
              return _originalFetch(url + separator + 'session_id=' + encodeURIComponent(sessionId), options);
            }
          }
          return _originalFetch.apply(this, arguments);
        };

        function formatTime(iso) {
          if (!iso) return '';
          try {
            var d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            var now = new Date();
            var diff = Math.floor((now - d) / 1000);
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
          } catch (_) {
            return '';
          }
        }

        function escapeHtml(text) {
          var div = document.createElement('div');
          div.appendChild(document.createTextNode(text));
          return div.innerHTML;
        }

        function renderSessionsIntoReact() {
          var container = document.getElementById('sessions-container');
          if (!container) return;
          var currentId = getCurrentSessionId();
          container.innerHTML = '<div style="padding:12px 0;text-align:center;color:#555;font-size:12px">加载中...</div>';
          fetch('/api/sessions')
            .then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.json();
            })
            .then(function (data) {
              var sessions = data.sessions || [];
              if (sessions.length === 0) {
                container.innerHTML = '<div class="sidebar-sessions-empty">暂无对话，点击 ＋ 新建</div>';
                return;
              }
              var html = '';
              for (var i = 0; i < sessions.length; i++) {
                var s = sessions[i];
                var isActive = s.id === currentId;
                var time = formatTime(s.updated_at || s.created_at);
                var msgCount = s.message_count || 0;
                var title = s.name || '新对话';
                html += '<div class="sidebar-item' + (isActive ? ' active' : '') + '" data-id="' + s.id + '">';
                html += '<span class="item-bullet" style="font-size:10px;color:#555;min-width:16px">' + (isActive ? '▶' : '●') + '</span>';
                html += '<div class="session-info" data-session-id="' + s.id + '">';
                html += '<div class="session-name">' + escapeHtml(title) + '</div>';
                html += '<div class="session-meta">' + msgCount + '条消息 · ' + time + '</div>';
                html += '</div>';
                html += '<button class="session-delete" data-id="' + s.id + '" title="删除">✕</button>';
                html += '</div>';
              }
              container.innerHTML = html;

              var infoEls = container.querySelectorAll('.session-info');
              for (var j = 0; j < infoEls.length; j++) {
                infoEls[j].addEventListener('click', (function (id) {
                  return function () {
                    window.location.href = '/?session=' + id;
                  };
                })(infoEls[j].getAttribute('data-session-id')));
              }

              var delBtns = container.querySelectorAll('.session-delete');
              for (var k = 0; k < delBtns.length; k++) {
                delBtns[k].addEventListener('click', (function (id) {
                  return function (e) {
                    e.stopPropagation();
                    if (!confirm('确认删除此对话？删除后无法恢复。')) return;
                    fetch('/api/sessions/' + id, { method: 'DELETE' })
                      .then(function (res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        var current = getCurrentSessionId();
                        if (current === id) {
                          window.location.href = '/';
                        } else {
                          renderSessionsIntoReact();
                        }
                      })
                      .catch(function () {});
                  };
                })(delBtns[k].getAttribute('data-id')));
              }
            })
            .catch(function () {
              container.innerHTML = '<div class="sidebar-sessions-empty">无法加载对话</div>';
            });
        }

        function createNewSession() {
          fetch('/api/sessions', { method: 'POST' })
            .then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.json();
            })
            .then(function (data) {
              var id = data.session_id || data.id;
              if (id) {
                window.location.href = '/?session=' + id;
              }
            })
            .catch(function () {});
        }

        // Inject sessions panel into React sidebar
        function injectSessionsPanel() {
          var shortcutsSection = document.querySelector('.sidebar-section .section-title-clickable');
          if (!shortcutsSection) return false;

          var section = shortcutsSection.closest('.sidebar-section');
          if (!section || document.getElementById('sessions-container')) return false;

          // Store original HTML and replace with sessions
          var addBtn = document.createElement('button');
          addBtn.className = 'sidebar-session-add-btn';
          addBtn.title = '新对话';
          addBtn.textContent = '＋';
          addBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            createNewSession();
          });

          var titleSpan = document.createElement('span');
          titleSpan.textContent = '对话';
          titleSpan.style.cssText = 'font-size:13px;font-weight:600';

          var h3 = section.querySelector('.section-title, .section-title-clickable');
          if (h3) {
            h3.innerHTML = '';
            h3.style.cssText = 'display:flex;align-items:center;justify-content:space-between;cursor:default';
            h3.className = 'section-title';
            h3.appendChild(titleSpan);
            h3.appendChild(addBtn);
          }

          // Remove the old expandable content
          var oldContent = section.querySelector('.sidebar-shortcuts');
          if (oldContent) oldContent.remove();

          // Add sessions container
          section.className = 'sidebar-section sessions-section';
          var container = document.createElement('div');
          container.id = 'sessions-container';
          container.style.cssText = 'max-height:300px;overflow-y:auto';
          section.appendChild(container);

          renderSessionsIntoReact();
          return true;
        }

        // Wait for React to render sidebar, then inject
        var observer = new MutationObserver(function () {
          if (injectSessionsPanel()) {
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // Also try on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', function () {
          setTimeout(injectSessionsPanel, 500);
        });
      })();
    </script>
  </body>
</html>
